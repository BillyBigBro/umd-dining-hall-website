<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMD Rankings</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="rankings.html">Rankings</a>
        <a class="nav-link" href="about.html">About</a>
      </nav>
      <a
        class="report-button"
        href="https://forms.gle/LW92omkf9WCsPmiu5"
        target="_blank"
        rel="noopener noreferrer"
      >
        Report Missing Food Item
      </a>
    </header>

    <main class="hero">
      <div class="hero-inner">
        <h1 class="page-title fade-in-up">Food Rankings</h1>
        <p class="hero-subtitle fade-in-up delay-1">All-time and weekly search leaders.</p>
      </div>
    </main>

    <section class="ranking-section fade-in-up delay-2">
      <h2 class="ranking-title">All-Time Top 10</h2>
      <table class="ranking-table" aria-live="polite">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Item</th>
            <th>Searches</th>
          </tr>
        </thead>
        <tbody id="rankingGrid"></tbody>
      </table>
    </section>

    <section class="ranking-section fade-in-up delay-3">
      <h2 class="ranking-title">Weekly Top 10</h2>
      <table class="ranking-table" aria-live="polite">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Item</th>
            <th>Searches</th>
          </tr>
        </thead>
        <tbody id="weeklyRankingGrid"></tbody>
      </table>
    </section>

    <script src="rankings.js"></script>
  </body>
</html>
