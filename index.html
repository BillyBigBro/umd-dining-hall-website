<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMD Nutrition Facts</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="rankings.html">Rankings</a>
        <a class="nav-link" href="about.html">About</a>
      </nav>
      <a
        class="report-button"
        href="https://forms.gle/LW92omkf9WCsPmiu5"
        target="_blank"
        rel="noopener noreferrer"
      >
        Report Missing Food Item
      </a>
    </header>

    <main class="hero">
      <div class="hero-inner">
        <h1 class="hero-title fade-in-up">UMD Nutrition Facts</h1>
        <p class="hero-subtitle fade-in-up delay-1">
          Nutrition information for everything UMD serves!
        </p>

        <div class="search-card fade-in-up delay-2">
          <div class="search-row">
            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder=""
              autocomplete="off"
              aria-label="Search food name"
            />
            <button id="searchButton" class="search-button" aria-label="Search">
              <span class="search-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div id="results" class="search-results" role="listbox"></div>
        </div>
      </div>
    </main>

    <section id="details" class="details" aria-live="polite"></section>

    <script src="app.js"></script>
  </body>
</html>
